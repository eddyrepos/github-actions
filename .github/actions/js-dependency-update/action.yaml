name: Update NPM dependecy
description: "Check if there are updates to npm packages , and create PR eith the uodated package.json."
inputs:
  node-version:
    description: Nodejs version to use
    default: 20.x
    required: false
  working-dir:
    description: the working directory of the app
    default: .
    required: false 


runs:
  using: node20
  main: index.js
  steps:
    - name: Setup NodeJS version ${{ inputs.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}
    - name: Cache dependencies
      id: cache
      uses: actions/cache@v3
      with:
        path: ${{ inputs.working-dir }}/node_modules
        key: node-modules-${{ hashFiles (format('{0}/{1}', inputs.working-dir, 'package-lock.json')) }}
    - name: Install dependency
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-dir }}