name: 13 - Using- Caching
on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to execute cache steps
        type: boolean
        default: true 
jobs:
  build:
    defaults:
      run:
        working-directory:  13-caching/react-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Node
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install dependency
        run: npm ci
      - name: Run Tests
        run: npm run test
      - name: Building  
        run: npm run build