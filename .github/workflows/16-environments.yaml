name: 16 - Working with Environments
on:
  workflow_dispatch:
    inputs:
      target-env:
        type: environment
        default: staging
jobs:
  echo: 
    runs-on: ubuntu-latest
    environment: ${{ inputs.target-env }}
    env:
      my-env: ${{ vars.MY_ENV_VAR || 'default value' }}
    steps:
      - name: vars  
        run: |
          echo "VARIABLES: ${{ env.my-env }}"