name: 06 - Contexts
run-name: 06 - Contexts | DEBUG - ${{ inputs.debug }}
on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false
env:
  GLOBAL_VAR: "GLOBAL ORIGIN"
  GLOBLA_OVERWRITTEN_VAR: "GLOBAL"
jobs:
  echo-data:
    runs-on: ubuntu-latest 
    env:
      JOB_VAR: "JOB VAR"
      GLOBLA_OVERWRITTEN_VAR: "JOB OVERWRITTEN VAR"
    steps:
      - name: Display Information
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
      - name: Retrieve variable
        run: |
          echo "Variable value: ${{ vars.MY_VAR }}"
      - name: Test vars
        env: 
          GLOBLA_OVERWRITTEN_VAR: "steps"
        run: |
          echo "Variable value: ${{ vars.GLOBLA_OVERWRITTEN_VAR }}"
      - name: Print vars
        run: |
          echo "Variable value: ${{ vars.GLOBLA_VAR }}"
          echo "Variable value: ${{ vars.GLOBLA_OVERWRITTEN_VAR }}"